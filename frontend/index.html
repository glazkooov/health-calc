<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор здоровья</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Калькулятор здоровья</h1>

        <div class="card">
            <h2>Расчет ИМТ и нормы калорий</h2>
            <div class="form">
                <label>Имя
                    <input type="text" id="name" placeholder="Иван">
                </label>
                <label>Пол
                    <select id="gender">
                        <option value="m">Мужской</option>
                        <option value="f">Женский</option>
                    </select>
                </label>
                <label>Возраст
                    <input type="number" id="age" placeholder="20">
                </label>
                <label>Рост, см
                    <input type="number" id="height" placeholder="175">
                </label>
                <label>Вес, кг
                    <input type="number" id="weight" placeholder="70">
                </label>
                <label>Активность
                    <select id="activity">
                        <option value="1">Минимальная (сидячая работа)</option>
                        <option value="2">Низкая (1-3 тренировки в неделю)</option>
                        <option value="3">Средняя (3-5 тренировок в неделю)</option>
                        <option value="4">Высокая (6-7 тренировок в неделю)</option>
                        <option value="5">Очень высокая (спорт + физ. работа)</option>
                    </select>
                </label>
            </div>
            <button id="calcBtn">Рассчитать</button>
            <div id="result"></div>
        </div>

        <div class="card">
            <h2>Дневник измерений</h2>
            <button id="loadBtn">Показать дневник</button>
            <table id="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Пол</th>
                        <th>Возраст</th>
                        <th>Рост</th>
                        <th>Вес</th>
                        <th>ИМТ</th>
                        <th>Категория</th>
                        <th>Ккал/день</th>
                        <th>Дата</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
